# Escenario para lab10/problems/problem_5.pddl
viewer:
  camera_pos: [1.5, 1.5, 1.5]
  camera_lookat: [0.0, 0.0, 0.40]

environment:
  plane: true
  gravity: [0.0, 0.0, -9.81]

robots:
  - name: "Manito"
    urdf_path: "assets/robots/manito/manito.urdf"
    position: [0.0, 0.0, 0.7]
    fixed: true
    is_main: true

props:
  - name: "Mesa Tablero"
    urdf_path: "assets/props/table_top.urdf"
    position: [0.0, 0.0, -0.315]
    euler: [0.0, 0.0, 90.0]
    surface: "smooth"

  - name: "Mesa Patas"
    urdf_path: "assets/props/table_legs.urdf"
    position: [0.0, 0.0, -0.315]
    euler: [0.0, 0.0, 90.0]
    surface: "rough"
    color: [0.5, 0.5, 0.5]

objects:
  - type: "mesh"
    name: "Plano Cartesiano"
    file: "assets/props/grid_plane_1m.obj"
    scale: 1.0
    pos: [0.0, 0.0, 0.701]
    euler: [0.0, 0.0, 0.0]
    fixed: true
    convexify: false
    surface: "smooth"
    texture: "assets/props/grid_plane_1m.png"

  # item A - zona-derecha (init: at A zona-derecha, todavia sin apilar) -- j1=90, j3=30, z=-10
  - type: "box"
    name: "Cubo A"
    size: [0.04, 0.04, 0.04]
    pos: [-0.345, -0.017, 0.72]
    surface: "rough"
    color: [1.0, 0.2, 0.2]

  # item B - zona-izquierda, base de la torre -- j1=60, j3=30, z=-10
  - type: "box"
    name: "Cubo B"
    size: [0.04, 0.04, 0.04]
    pos: [-0.333, 0.165, 0.72]
    surface: "rough"
    color: [1.0, 0.9, 0.2]

  # item G - encima de B (init: on G B, resultado de problem_4) -> mismo x,y que B, z + altura del cubo
  - type: "box"
    name: "Cubo G"
    size: [0.04, 0.04, 0.04]
    pos: [-0.333, 0.165, 0.76]
    surface: "rough"
    color: [0.2, 1.0, 0.3]

  # item R - zona-b (init: at R zona-b, sin cambios) -- j1=30, j3=30, z=-10
  - type: "box"
    name: "Cubo R"
    size: [0.04, 0.04, 0.04]
    pos: [-0.231, 0.316, 0.72]
    surface: "rough"
    color: [0.2, 0.2, 1.0]

stream_camera:
  pos: [1.0, 1.0, 1.5]
  lookat: [0.0, 0.0, 0.40]
  res: [640, 480]

objectives:
  - id: "apilar_a_sobre_r"
    description: "Apila el cubo A sobre el cubo R (goal: on A R)."
